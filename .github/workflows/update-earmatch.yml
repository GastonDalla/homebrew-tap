name: Update Earmatch

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-earmatch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: GastonDalla/earmatch
          CASK: Casks/earmatch.rb
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
          latest="${tag#v}"
          if [[ ! "$latest" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Unexpected release tag: $tag"
            exit 1
          fi
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")"
          if [[ "$latest" == "$current" ]]; then
            echo "Earmatch $current is already the latest release."
            exit 0
          fi
          dir="$(mktemp -d)"
          dmg="Earmatch-$latest.dmg"
          gh release download "$tag" --repo "$REPO" --pattern "$dmg" --dir "$dir"
          sha="$(sha256sum "$dir/$dmg" | cut -d ' ' -f 1)"
          sed -i \
            -e "s/^  version \".*\"$/  version \"$latest\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
            "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore(earmatch): update to $latest"
          git push origin HEAD:main
          echo "Earmatch updated from $current to $latest."
